[package]
name = "macscan-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
libc.workspace = true
macscan-engine.workspace = true
macscan-analysis.workspace = true
